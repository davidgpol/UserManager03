openapi: 3.0.3
info:
  title: UserManager03
  version: 0.1.0
  description: 'Contrato previo a endpoints. Cuenta operadora configurable separada de fichas; crear ficha no concede
    acceso. REST → Servicio → Persistencia → PostgreSQL. Seguridad antes de entrada/existencia/unicidad: CSRF 403
    precede a 401 en mutaciones, incluido login/logout. Tras seguridad: representación/entradas, existencia y unicidad;
    no se fija precedencia entre múltiples infracciones de entrada. Rechazos atómicos sin mutación ni divulgación.
    Sesión servidor en memoria IF_REQUIRED, 30 min inactiva y 8 h absoluta inicialmente; solo solicitudes autenticadas
    aceptadas renuevan actividad, comprobar ambos límites antes de autorizar, igualdad al límite expira. Configuración
    positiva idle<=absoluta. Sesiones independientes; reinicio invalida todas. 401 en UI limpia datos/token y presenta
    login; 403 CSRF recupera token/estado sin reintento automático de mutaciones. No persistir credenciales/tokens/fichas
    en navegador. Misma procedencia HTTPS privada, sin CORS comodín.'
servers:
- url: /
  description: Mismo origen HTTPS de SPA/API; destino privado aún no desplegado.
tags:
- name: Users
- name: Auth
security:
- operatorSession: []
paths:
  /api/users:
    get:
      tags:
      - Users
      operationId: listUsers
      summary: Listar y buscar fichas
      description: 'Orden fijo createdAt ASC, id ASC con comparación UUID nativa PostgreSQL; filtros antes de paginar.
        Solo page,size,status,q, una ocurrencia cada uno; adicionales incluido sort: 400 INVALID_QUERY. UI inicia
        activos sin búsqueda, vuelve a página cero al cambiar filtro/tamaño y refresca tras mutar.'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
          default: '0'
        description: 'Entero decimal ASCII 0..1000000, rango antes de conversión, ceros iniciales permitidos. Omitido:
          0. Rechazar vacío/repetido/fracción/signo/exponente/espacios. String HTTP para conservar forma léxica;
          metadatos de salida numéricos.'
      - name: size
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
          default: '20'
        description: 'Entero decimal ASCII 1..100, rango antes de conversión, ceros iniciales permitidos. Omitido:
          20. Rechazar vacío/repetido/fracción/signo/exponente/espacios. String HTTP para conservar forma léxica;
          metadatos de salida numéricos.'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - inactive
          - all
          default: active
        description: 'Estado AND texto; all incluye ambos. Repetido/vacío/desconocido: INVALID_QUERY.'
      - name: q
        in: query
        required: false
        allowEmptyValue: true
        schema:
          type: string
        description: 'Una caja global y una sola ocurrencia. Recorte exterior; omitido/vacío/solo espacios elimina
          solo predicado textual. OR: nombre/apellidos parciales sin distinguir caso ni diacríticos; email parcial
          sin distinguir caso, conservando diacríticos; DNI exacto canónico válido. DNI inválido deja falsa solo
          esa rama y no causa 400; DNI válido no excluye otras ramas. AND status. Conservar espacios interiores;
          sin regex/comodines ni máximo heredado de nombres; no reescribir valores almacenados.'
      responses:
        '200':
          description: Página y total coherentes.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: No guardar respuestas de gestión/autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
    post:
      tags:
      - Users
      operationId: createUser
      summary: Crear ficha activa
      security:
      - operatorSession: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Ficha activa con id/auditoría backend.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: No guardar respuestas de gestión/autenticación.
            Location:
              schema:
                type: string
              description: /api/users/{id} creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '409':
          $ref: '#/components/responses/409'
        '415':
          $ref: '#/components/responses/415'
  /api/users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      description: UUID completo, ambos casos, sin espacios/llaves/abreviaturas. Forma inválida 400 INVALID_ID;
        forma válida inexistente 404 USER_NOT_FOUND.
    get:
      tags:
      - Users
      operationId: getUser
      summary: Consultar detalle activo o inactivo
      responses:
        '200':
          description: Detalle completo.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: No guardar respuestas de gestión/autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '404':
          $ref: '#/components/responses/404'
    put:
      tags:
      - Users
      operationId: updateUser
      summary: Sustituir datos editables sin reactivar
      security:
      - operatorSession: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Conserva id, active y createdAt; no-op conserva updatedAt.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: No guardar respuestas de gestión/autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '415':
          $ref: '#/components/responses/415'
    delete:
      tags:
      - Users
      operationId: deactivateUser
      summary: Dar de baja lógicamente de forma idempotente
      security:
      - operatorSession: []
        csrfToken: []
      description: Primera transición active=false y updatedAt UTC nuevo. Repetición inactiva conserva todos los
        datos y auditoría sin guardar. Servicio serializa bajas/ediciones concurrentes sobre fila. Nunca borra físicamente
        ni reactiva.
      responses:
        '204':
          description: Baja realizada o ficha ya inactiva. Sin cuerpo.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: No guardar respuestas de gestión/autenticación.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '404':
          $ref: '#/components/responses/404'
  /api/auth/csrf:
    get:
      tags:
      - Auth
      operationId: getCsrfToken
      summary: Obtener token CSRF BREACH compatible
      security: []
      description: Público; HttpSessionCsrfTokenRepository. Puede crear sesión anónima sin permiso CRUD. Obtener
        de nuevo después de login/logout; cabecera X-CSRF-TOKEN desde memoria SPA.
      responses:
        '200':
          description: Operación completada.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: No guardar respuestas de gestión/autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
  /api/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Autenticar cuenta operadora
      security:
      - csrfToken: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  minLength: 1
                password:
                  type: string
                  format: password
                  minLength: 1
                  writeOnly: true
      description: 'Filtro estándar Spring Security. Ausencia de campos requeridos: 400 VALIDATION_ERROR; credenciales
        incorrectas: 401 INVALID_CREDENTIALS genérico. Rotar id de sesión y persistir contexto; renovar token CSRF.
        Sin redirect HTML, autorregistro ni remember-me.'
      responses:
        '204':
          description: Sesión autenticada; rotación de cookie. Sin cuerpo.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: No guardar respuestas de gestión/autenticación.
            Set-Cookie:
              schema:
                type: string
              description: UM03SESSION; Secure; HttpOnly; SameSite=Lax; Path=/; sin Domain. Cookie no persistente
                al autenticar; borrado al salir.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
        '415':
          $ref: '#/components/responses/415'
  /api/auth/session:
    get:
      tags:
      - Auth
      operationId: getSession
      summary: Consultar estado autenticado
      description: Usar al cargar UI, sin polling para prolongar sesión. 401 al faltar/caducar sesión.
      responses:
        '200':
          description: Sesión autenticada.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: No guardar respuestas de gestión/autenticación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /api/auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Terminar sesión actual
      security:
      - operatorSession: []
        csrfToken: []
      description: Invalidar solo sesión presentada y eliminar cookie con mismos atributos. Requiere sesión válida
        después de CSRF; 401 si ausente, 403 si CSRF ausente/inválido aun sin sesión. Obtener token nuevo tras logout.
      responses:
        '204':
          description: Sesión invalidada; cookie eliminada. Sin cuerpo.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: No guardar respuestas de gestión/autenticación.
            Set-Cookie:
              schema:
                type: string
              description: UM03SESSION; Secure; HttpOnly; SameSite=Lax; Path=/; sin Domain. Cookie no persistente
                al autenticar; borrado al salir.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: UM03SESSION
      description: Cookie de sesión Secure/HttpOnly/SameSite=Lax/Path=/ sin Domain; nunca sesión por URL.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Token obtenido por GET /api/auth/csrf. Protección BREACH habilitada.
  schemas:
    UserCreateRequest:
      type: object
      additionalProperties: false
      required:
      - firstName
      - lastName
      - dni
      - email
      properties:
        firstName:
          type: string
          description: 'Unicode General_Category 16.0.0. Recortar solo extremos consecutivos Zs (U+0020,00A0,1680,2000–200A,202F,205F,3000).
            Cf detiene el recorte. Admitir L/M/N/P/S, Zs y Cf; exigir al menos un punto L/M/N/P/S. Rechazar Cc/Cs/Cn/Co/Zl/Zp
            en cualquier posición; rechazar sustitutos aislados sin reparación. Contar todos los puntos tras recorte,
            incluidas marcas y formatos: 1–100. Preservar exactamente, sin normalización, cambio de caso, eliminación
            de diacríticos, colapso ni truncamiento. No limitar longitud bruta ni unidades UTF-16. Validación de
            dominio en servicio; la extensión no ejecuta validación.'
          x-usermanager-unicode:
            version: 16.0.0
            categorySource: https://www.unicode.org/Public/16.0.0/ucd/extracted/DerivedGeneralCategory.txt
            categorySourceSha256: 7676ab755a41ef82108460238569e60ad65c191ddafe61b36c6765ec1353f293
            trimCategory: Zs
            lengthUnit: codePoint
            minAfterTrim: 1
            maxAfterTrim: 100
            contentCategories:
            - Lu
            - Ll
            - Lt
            - Lm
            - Lo
            - Mn
            - Mc
            - Me
            - Nd
            - Nl
            - 'No'
            - Pc
            - Pd
            - Ps
            - Pe
            - Pi
            - Pf
            - Po
            - Sm
            - Sc
            - Sk
            - So
            additionalAllowedCategories:
            - Zs
            - Cf
            rejectedCategories:
            - Cc
            - Cs
            - Cn
            - Co
            - Zl
            - Zp
            normalization: none
        lastName:
          type: string
          description: 'Unicode General_Category 16.0.0. Recortar solo extremos consecutivos Zs (U+0020,00A0,1680,2000–200A,202F,205F,3000).
            Cf detiene el recorte. Admitir L/M/N/P/S, Zs y Cf; exigir al menos un punto L/M/N/P/S. Rechazar Cc/Cs/Cn/Co/Zl/Zp
            en cualquier posición; rechazar sustitutos aislados sin reparación. Contar todos los puntos tras recorte,
            incluidas marcas y formatos: 1–150. Preservar exactamente, sin normalización, cambio de caso, eliminación
            de diacríticos, colapso ni truncamiento. No limitar longitud bruta ni unidades UTF-16. Validación de
            dominio en servicio; la extensión no ejecuta validación.'
          x-usermanager-unicode:
            version: 16.0.0
            categorySource: https://www.unicode.org/Public/16.0.0/ucd/extracted/DerivedGeneralCategory.txt
            categorySourceSha256: 7676ab755a41ef82108460238569e60ad65c191ddafe61b36c6765ec1353f293
            trimCategory: Zs
            lengthUnit: codePoint
            minAfterTrim: 1
            maxAfterTrim: 150
            contentCategories:
            - Lu
            - Ll
            - Lt
            - Lm
            - Lo
            - Mn
            - Mc
            - Me
            - Nd
            - Nl
            - 'No'
            - Pc
            - Pd
            - Ps
            - Pe
            - Pi
            - Pf
            - Po
            - Sm
            - Sc
            - Sk
            - So
            additionalAllowedCategories:
            - Zs
            - Cf
            rejectedCategories:
            - Cc
            - Cs
            - Cn
            - Co
            - Zl
            - Zp
            normalization: none
        dni:
          type: string
          description: Recorte exterior; exactamente ocho dígitos ASCII y letra de control válida, letra a mayúscula.
            Sin separadores interiores ni NIE; conservar ceros iniciales. Canónico NNNNNNNNL, letra TRWAGMYFPDXBNJZSQVHLCKE[número
            mod 23]. Unicidad global incluidas fichas inactivas; conservar el propio canónico en edición permitido.
            Entrada bruta no tiene patrón/longitud estricta de salida.
          example: ' 00000000t '
        email:
          type: string
          format: email
          description: Obligatorio, no null ni vacío/solo blancos; sin recorte ni transformación. Jakarta @Email
            del proveedor Hibernate Validator 9.1.5.Final, Jakarta Validation 3.1.1, gestionado por Boot 4.1.2.
            Sin regex de negocio adicional, DNS, envío ni unicidad. Fixtures en fixtures/email.json; format email
            no sustituye la validación runtime.
      description: 'Alta completa. Cuatro strings obligatorios no null. Claves duplicadas: MALFORMED_JSON. Sin coerción
        número→string. id/active/createdAt/updatedAt: READ_ONLY_FIELD; adicionales: UNKNOWN_FIELD con field=$. La
        seguridad precede a la validación.'
    UserUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - firstName
      - lastName
      - dni
      - email
      properties:
        firstName:
          type: string
          description: 'Unicode General_Category 16.0.0. Recortar solo extremos consecutivos Zs (U+0020,00A0,1680,2000–200A,202F,205F,3000).
            Cf detiene el recorte. Admitir L/M/N/P/S, Zs y Cf; exigir al menos un punto L/M/N/P/S. Rechazar Cc/Cs/Cn/Co/Zl/Zp
            en cualquier posición; rechazar sustitutos aislados sin reparación. Contar todos los puntos tras recorte,
            incluidas marcas y formatos: 1–100. Preservar exactamente, sin normalización, cambio de caso, eliminación
            de diacríticos, colapso ni truncamiento. No limitar longitud bruta ni unidades UTF-16. Validación de
            dominio en servicio; la extensión no ejecuta validación.'
          x-usermanager-unicode:
            version: 16.0.0
            categorySource: https://www.unicode.org/Public/16.0.0/ucd/extracted/DerivedGeneralCategory.txt
            categorySourceSha256: 7676ab755a41ef82108460238569e60ad65c191ddafe61b36c6765ec1353f293
            trimCategory: Zs
            lengthUnit: codePoint
            minAfterTrim: 1
            maxAfterTrim: 100
            contentCategories:
            - Lu
            - Ll
            - Lt
            - Lm
            - Lo
            - Mn
            - Mc
            - Me
            - Nd
            - Nl
            - 'No'
            - Pc
            - Pd
            - Ps
            - Pe
            - Pi
            - Pf
            - Po
            - Sm
            - Sc
            - Sk
            - So
            additionalAllowedCategories:
            - Zs
            - Cf
            rejectedCategories:
            - Cc
            - Cs
            - Cn
            - Co
            - Zl
            - Zp
            normalization: none
        lastName:
          type: string
          description: 'Unicode General_Category 16.0.0. Recortar solo extremos consecutivos Zs (U+0020,00A0,1680,2000–200A,202F,205F,3000).
            Cf detiene el recorte. Admitir L/M/N/P/S, Zs y Cf; exigir al menos un punto L/M/N/P/S. Rechazar Cc/Cs/Cn/Co/Zl/Zp
            en cualquier posición; rechazar sustitutos aislados sin reparación. Contar todos los puntos tras recorte,
            incluidas marcas y formatos: 1–150. Preservar exactamente, sin normalización, cambio de caso, eliminación
            de diacríticos, colapso ni truncamiento. No limitar longitud bruta ni unidades UTF-16. Validación de
            dominio en servicio; la extensión no ejecuta validación.'
          x-usermanager-unicode:
            version: 16.0.0
            categorySource: https://www.unicode.org/Public/16.0.0/ucd/extracted/DerivedGeneralCategory.txt
            categorySourceSha256: 7676ab755a41ef82108460238569e60ad65c191ddafe61b36c6765ec1353f293
            trimCategory: Zs
            lengthUnit: codePoint
            minAfterTrim: 1
            maxAfterTrim: 150
            contentCategories:
            - Lu
            - Ll
            - Lt
            - Lm
            - Lo
            - Mn
            - Mc
            - Me
            - Nd
            - Nl
            - 'No'
            - Pc
            - Pd
            - Ps
            - Pe
            - Pi
            - Pf
            - Po
            - Sm
            - Sc
            - Sk
            - So
            additionalAllowedCategories:
            - Zs
            - Cf
            rejectedCategories:
            - Cc
            - Cs
            - Cn
            - Co
            - Zl
            - Zp
            normalization: none
        dni:
          type: string
          description: Recorte exterior; exactamente ocho dígitos ASCII y letra de control válida, letra a mayúscula.
            Sin separadores interiores ni NIE; conservar ceros iniciales. Canónico NNNNNNNNL, letra TRWAGMYFPDXBNJZSQVHLCKE[número
            mod 23]. Unicidad global incluidas fichas inactivas; conservar el propio canónico en edición permitido.
            Entrada bruta no tiene patrón/longitud estricta de salida.
          example: ' 00000000t '
        email:
          type: string
          format: email
          description: Obligatorio, no null ni vacío/solo blancos; sin recorte ni transformación. Jakarta @Email
            del proveedor Hibernate Validator 9.1.5.Final, Jakarta Validation 3.1.1, gestionado por Boot 4.1.2.
            Sin regex de negocio adicional, DNS, envío ni unicidad. Fixtures en fixtures/email.json; format email
            no sustituye la validación runtime.
      description: 'PUT completo, sin PATCH ni upsert. Rechazar campos no editables/adicionales; no reactivar. Comparar
        valores efectivos después de transformaciones aprobadas: no-op conserva updatedAt. Serializar con DELETE
        y otras ediciones por confirmación transaccional; sin ETag.'
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - firstName
      - lastName
      - dni
      - email
      - active
      - createdAt
