# PostgreSQL container entrypoint supplies PGDATA; HBA/TLS remain deployment options.
listen_addresses = '*'
# DEF-QA-001: preserve ERROR/SQLSTATE/session diagnostics without row values.
# Shared by the permanent deployment and the isolated PostgreSQL test service.
log_min_messages = warning
log_error_verbosity = terse
log_min_error_statement = panic
log_statement = none
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_duration_statement = -1
log_min_duration_sample = -1
log_transaction_sample_rate = 0
log_line_prefix = '%m [%p] session=%c sqlstate=%e '
log_timezone = 'UTC'
