services:
  db:
    image: postgres:18.6@sha256:a8be76d23699a6c366437e9f80ead007975f24c35e01c9ee0533c6930ab57ac1
    platform: linux/arm64
    user: "${UM03_UID}:${UM03_GID}"
    environment:
      POSTGRES_USER: um03_migrate
      POSTGRES_DB: usermanager03
      POSTGRES_PASSWORD_FILE: /run/secrets/spring.flyway.password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/secrets/db.crt, -c, ssl_key_file=/run/secrets/db.key, -c, config_file=/etc/postgresql/um03-logging.conf]
    volumes:
      - ../runtime/postgres-logging.conf:/etc/postgresql/um03-logging.conf:ro
      - ${UM03_TEST_SECRETS}:/run/secrets:ro
      - ./init-role.sh:/docker-entrypoint-initdb.d/10-role.sh:ro
    tmpfs:
      - /var/lib/postgresql:uid=${UM03_UID},gid=${UM03_GID},mode=0700
      - /var/run/postgresql:uid=${UM03_UID},gid=${UM03_GID},mode=0700
    healthcheck:
      test: [CMD-SHELL, pg_isready -U um03_migrate -d usermanager03]
      interval: 2s
      timeout: 2s
      retries: 30
    labels:
      com.hariklabs.project: usermanager03
      com.hariklabs.lifecycle: temporary
      com.hariklabs.run: ${PAPERCLIP_RUN_ID}
  verify:
    image: usermanager03-toolchain:7e663ce2-43fc-488e-a1ee-d1a44950d594
    platform: linux/arm64
    user: "${UM03_UID}:${UM03_GID}"
    environment:
      UM03_DB_TEST: 'true'
    volumes:
      - ../..:/workspace
      - ${UM03_TEST_SECRETS}:/run/secrets:ro
      - ${UM03_MAVEN_CACHE}:/cache
    command: [bash, platform/backend/check.sh, -Dmaven.repo.local=/cache, test]
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.hariklabs.project: usermanager03
      com.hariklabs.lifecycle: temporary
      com.hariklabs.run: ${PAPERCLIP_RUN_ID}
networks:
  default:
    labels:
      com.hariklabs.project: usermanager03
      com.hariklabs.lifecycle: temporary
      com.hariklabs.run: ${PAPERCLIP_RUN_ID}
